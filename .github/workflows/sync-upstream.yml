name: Sync upstream with local patch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: cfnext-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out customized repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned deployment tooling
        run: npm ci
      - name: Fetch upstream source
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Upstream source fetch/check failed at line $LINENO. Production files remain unchanged."' ERR
          git fetch --no-tags https://github.com/PAICNI/CFNext.git main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "Candidate upstream: $upstream_sha"
          candidate="$RUNNER_TEMP/cfnext-upstream.js"
          git show "$upstream_sha:CFNext 明文版.js" > "$candidate"
          node custom/verify-source.mjs "$candidate"
          printf '%s\n' "$upstream_sha" > "$RUNNER_TEMP/cfnext-upstream-sha"
      - name: Apply local customization
        run: node custom/patch.mjs "$RUNNER_TEMP/cfnext-upstream.js" "CFNext 明文版.js"
      - name: Verify local customization
        run: npm run verify:custom
      - name: Test stable refresh behavior
        run: npm test
      - name: Build and validate Pages artifact
        run: npm run check
      - name: Commit verified upstream update
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/cfnext-upstream-sha" UPSTREAM_COMMIT
          git add -- "CFNext 明文版.js" UPSTREAM_COMMIT
          if git diff --cached --quiet; then
            echo "Already synchronized and patched."
            exit 0
          fi
          version="$(node --input-type=module -e 'import fs from "node:fs"; import {parse} from "acorn"; const ast=parse(fs.readFileSync("CFNext 明文版.js","utf8"),{sourceType:"module",ecmaVersion:"latest"}); console.log(ast.body.flatMap(n=>n.declarations||[]).find(n=>n.id.name==="VERSION").init.value);')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream CFNext ${version} + stable-bestip-v2"
          git push origin HEAD:main

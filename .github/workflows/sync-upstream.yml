name: Sync upstream with local patch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: cfnext-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out customized repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/PAICNI/CFNext.git main

          upstream_sha="$(git rev-parse FETCH_HEAD)"
          candidate="$RUNNER_TEMP/cfnext-upstream.js"
          pages_zip="$RUNNER_TEMP/cfnext-pages.zip"

          git show "FETCH_HEAD:CFNext 明文版.js" > "$candidate"
          git show "FETCH_HEAD:CFNext 混淆Pages版.zip" > "$pages_zip"

          size="$(wc -c < "$candidate")"
          test "$size" -ge 100000
          test "$size" -le 1000000
          grep -Fq "from 'cloudflare:sockets'" "$candidate"
          grep -Eq "const VERSION = ['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" "$candidate"
          grep -Fq "export default" "$candidate"

          cp "$candidate" "$RUNNER_TEMP/cfnext-custom.js"
          cp "$pages_zip" "CFNext 混淆Pages版.zip"
          printf '%s\n' "$upstream_sha" > UPSTREAM_COMMIT

      - name: Install pinned deployment tooling
        run: npm ci

      - name: Apply local customization
        run: node custom/patch.mjs "$RUNNER_TEMP/cfnext-custom.js" "CFNext 明文版.js"

      - name: Verify local customization
        run: node custom/verify.mjs "CFNext 明文版.js"

      - name: Validate Worker bundle
        run: npm run check

      - name: Commit verified upstream update
        shell: bash
        run: |
          set -euo pipefail

          git add --             "CFNext 明文版.js"             "CFNext 混淆Pages版.zip"             UPSTREAM_COMMIT

          if git diff --cached --quiet; then
            echo "Already synchronized and patched."
            exit 0
          fi

          version="$(sed -nE "s/^const VERSION = ['\"]([^'\"]+)['\"].*/\1/p" "CFNext 明文版.js" | head -n 1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream CFNext ${version:-unknown} + stable-bestip-v1"
          git push origin HEAD:main

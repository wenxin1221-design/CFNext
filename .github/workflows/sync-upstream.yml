name: Sync upstream and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: cfnext-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the upstream Worker and Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/PAICNI/CFNext.git main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          candidate="$RUNNER_TEMP/cfnext-worker.js"
          git show "FETCH_HEAD:CFNext 明文版.js" > "$candidate"
          pages_zip="$RUNNER_TEMP/cfnext-pages.zip"
          pages_worker="$RUNNER_TEMP/cfnext-pages-worker.js"
          git show "FETCH_HEAD:CFNext 混淆Pages版.zip" > "$pages_zip"

          size="$(wc -c < "$candidate")"
          test "$size" -ge 100000
          test "$size" -le 1000000
          grep -Fq "from 'cloudflare:sockets'" "$candidate"
          grep -Eq "const VERSION = ['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" "$candidate"
          grep -Fq "export default" "$candidate"
          test "$(unzip -Z1 "$pages_zip")" = "_worker.js"
          unzip -p "$pages_zip" _worker.js > "$pages_worker"
          pages_size="$(wc -c < "$pages_worker")"
          test "$pages_size" -ge 100000
          test "$pages_size" -le 1000000
          grep -Fq "cloudflare:sockets" "$pages_worker"
          grep -Fq "export default" "$pages_worker"

          cp "$candidate" "CFNext 明文版.js"
          cp "$pages_zip" "CFNext 混淆Pages版.zip"
          printf '%s\n' "$upstream_sha" > UPSTREAM_COMMIT

      - name: Install pinned deployment tooling
        run: npm ci

      - name: Validate the Worker bundle
        run: npm run check

      - name: Commit an upstream update
        shell: bash
        run: |
          set -euo pipefail
          git add -- "CFNext 明文版.js" "CFNext 混淆Pages版.zip" UPSTREAM_COMMIT
          if git diff --cached --quiet; then
            echo "Already synchronized."
            exit 0
          fi

          version="$(sed -nE "s/^const VERSION = ['\"]([^'\"]+)['\"].*/\1/p" "CFNext 明文版.js" | head -n 1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync CFNext ${version:-upstream}"
          git push origin HEAD:main
